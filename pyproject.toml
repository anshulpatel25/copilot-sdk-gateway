[project]
name = "copilot-sdk-gateway"
version = "0.1.0"
description = "OpenAI-API-compatible HTTP proxy backed by GitHub Copilot SDK"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "pydantic>=2.13.0",
    "uvicorn[standard]>=0.44.0",
    "pydantic-settings>=2.14.0",
    "github-copilot-sdk>=0.2.2",
    "prometheus-fastapi-instrumentator>=7.1",
]

[project.scripts]
copilot-sdk-gateway = "copilot_sdk_gateway.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
